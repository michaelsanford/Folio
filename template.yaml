AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Folio - Hardened Serverless Application (FastAPI + React 19 PWA + SQLite + Cognito) in ca-central-1

Parameters:
  EnvironmentName:
    Type: String
    Default: prod
    Description: Stage environment name (e.g. prod, staging, dev)

  MasterPasswordHash:
    Type: String
    NoEcho: true
    Default: ''
    Description: >-
      Optional bcrypt hash of the master passphrase for fallback vault
      authentication. A hash, not the passphrase: Lambda environment variables
      are readable by anyone holding lambda:GetFunctionConfiguration.

  OriginVerifySecret:
    Type: String
    NoEcho: true
    Default: ''
    Description: Optional secret verification header token injected by CloudFront/WAF to protect direct Lambda Function URL access

  AllowedOrigin:
    Type: String
    Default: ''
    Description: >-
      Optional exact origin permitted to call the API cross-origin, e.g.
      https://folio.example.com. Leave empty when the PWA is served from the
      function itself, which is the default and needs no CORS at all.

  EnableBedrock:
    Type: String
    Default: 'false'
    AllowedValues: ['true', 'false']
    Description: Enable AWS Bedrock recourse for transaction auto-classification

  BedrockModelId:
    Type: String
    Default: 'amazon.nova-micro-v1:0'
    Description: Model ID for AWS Bedrock auto-classification (e.g. amazon.nova-micro-v1:0 or anthropic.claude-3-haiku-20240307-v1:0)

Conditions:
  HasAllowedOrigin: !Not [!Equals [!Ref AllowedOrigin, '']]

Globals:
  Function:
    Timeout: 30
    MemorySize: 1024
    Architectures:
      - arm64

Resources:
  # 1. Private S3 Vault for Database Snapshots and Statement Archives
  FolioStorageVault:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    Properties:
      BucketName: !Sub 'folio-vault-${AWS::AccountId}-${AWS::Region}'
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      VersioningConfiguration:
        Status: Enabled
      LifecycleConfiguration:
        Rules:
          - Id: ExpireOldSnapshots
            Status: Enabled
            Prefix: database/
            NoncurrentVersionExpiration:
              NoncurrentDays: 30

  # 2. AWS Cognito User Pool for Zero-Trust Identity
  FolioUserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: !Sub 'folio-userpool-${EnvironmentName}'
      AdminCreateUserConfig:
        AllowAdminCreateUserOnly: true  # Prevents public sign-ups (Owner-only private vault)
      AutoVerifiedAttributes:
        - email
      MfaConfiguration: "ON"     # Supports TOTP Authenticator apps (Google Authenticator, 1Password, Apple Keychain)
      EnabledMfas:
        - SOFTWARE_TOKEN_MFA
      Policies:
        PasswordPolicy:
          MinimumLength: 20
          RequireLowercase: true
          RequireNumbers: false
          RequireSymbols: false
          RequireUppercase: false
      AccountRecoverySetting:
        RecoveryMechanisms:
          - Name: verified_email
            Priority: 1

  # 3. Cognito User Pool App Client for SPA PWA
  FolioUserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      ClientName: !Sub 'folio-client-${EnvironmentName}'
      UserPoolId: !Ref FolioUserPool
      GenerateSecret: false
      ExplicitAuthFlows:
        - ALLOW_USER_SRP_AUTH
        - ALLOW_REFRESH_TOKEN_AUTH
        - ALLOW_USER_PASSWORD_AUTH
      PreventUserExistenceErrors: ENABLED
      TokenValidityUnits:
        AccessToken: days
        IdToken: days
        RefreshToken: days
      AccessTokenValidity: 1
      IdTokenValidity: 1
      RefreshTokenValidity: 30

  # 4. Serverless Function (FastAPI + Embedded PWA via AWS Lambda Web Adapter)
  FolioServerlessFunction:
    Type: AWS::Serverless::Function
    Properties:
      PackageType: Image
      ReservedConcurrentExecutions: 1
      Environment:
        Variables:
          AWS_LWA_PORT: "8000"
          AWS_LWA_ASYNC_INIT: "true"
          FOLIO_ENV: !Ref EnvironmentName
          SQLITE_DB_PATH: "/tmp/folio.db"
          # Lambda's filesystem is read-only outside /tmp; statement uploads must land there.
          FOLIO_UPLOAD_DIR: "/tmp/uploads"
          S3_BUCKET_NAME: !Ref FolioStorageVault
          AWS_DEFAULT_REGION: !Ref AWS::Region
          FOLIO_MASTER_PASSWORD_HASH: !Ref MasterPasswordHash
          COGNITO_USER_POOL_ID: !Ref FolioUserPool
          COGNITO_CLIENT_ID: !Ref FolioUserPoolClient
          COGNITO_REGION: !Ref AWS::Region
          FOLIO_ORIGIN_VERIFY_SECRET: !Ref OriginVerifySecret
          FOLIO_CORS_ORIGINS: !Ref AllowedOrigin
          FOLIO_BEDROCK_ENABLED: !Ref EnableBedrock
          FOLIO_BEDROCK_MODEL_ID: !Ref BedrockModelId
      FunctionUrlConfig:
        AuthType: NONE
        # The app and its API are served from the same origin, so cross-origin
        # access is not needed at all. A wildcard origin combined with
        # AllowCredentials is invalid per the CORS specification and browsers
        # reject it -- set AllowedOrigin to a real origin only if you front the
        # function with a custom domain.
        Cors:
          AllowOrigins: !If
            - HasAllowedOrigin
            - [!Ref AllowedOrigin]
            - []
          AllowMethods:
            - 'GET'
            - 'POST'
            - 'PUT'
            - 'DELETE'
            - 'OPTIONS'
            - 'HEAD'
          AllowHeaders:
            - 'Content-Type'
            - 'Authorization'
            - 'X-Folio-Origin-Verify'
          AllowCredentials: true
      Policies:
        - S3CrudPolicy:
            BucketName: !Sub 'folio-vault-${AWS::AccountId}-${AWS::Region}'
        - Statement:
            - Effect: Allow
              Action:
                - 'bedrock:InvokeModel'
                - 'bedrock:InvokeModelWithResponseStream'
              Resource: '*'
    Metadata:
      DockerTag: latest
      DockerContext: .
      Dockerfile: Dockerfile

Outputs:
  FolioAppUrl:
    Description: Live Serverless HTTPS Endpoint for Folio App
    Value: !GetAtt FolioServerlessFunctionUrl.FunctionUrl

  CognitoUserPoolId:
    Description: AWS Cognito User Pool ID
    Value: !Ref FolioUserPool

  CognitoClientId:
    Description: AWS Cognito App Client ID
    Value: !Ref FolioUserPoolClient

  S3VaultBucket:
    Description: S3 Storage Vault Bucket Name
    Value: !Ref FolioStorageVault

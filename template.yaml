AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Folio - Hardened Serverless Application (FastAPI + React 19 PWA + SQLite + Cognito) in ca-central-1

Parameters:
  EnvironmentName:
    Type: String
    Default: prod
    AllowedPattern: '^[a-z0-9][a-z0-9-]{0,20}$'
    ConstraintDescription: Must be 1-21 lowercase alphanumeric characters or hyphens (used in S3 bucket naming).
    Description: Stage environment name (e.g. prod, staging, qa, dev)

  MasterPasswordHash:
    Type: String
    NoEcho: true
    Default: ''
    Description: >-
      Optional bcrypt hash of the master passphrase for fallback vault
      authentication. A hash, not the passphrase: Lambda environment variables
      are readable by anyone holding lambda:GetFunctionConfiguration.

  OriginVerifySecret:
    Type: String
    NoEcho: true
    Default: ''
    Description: Optional secret verification header token injected by CloudFront/WAF to protect direct Lambda Function URL access

  AllowedOrigin:
    Type: String
    Default: ''
    Description: >-
      Optional exact origin permitted to call the API cross-origin, e.g.
      https://folio.example.com. Leave empty when the PWA is served from the
      function itself, which is the default and needs no CORS at all.

  EnableBedrock:
    Type: String
    Default: 'false'
    AllowedValues: ['true', 'false']
    Description: Enable AWS Bedrock recourse for transaction auto-classification

  BedrockModelId:
    Type: String
    Default: 'amazon.nova-micro-v1:0'
    Description: Model ID for AWS Bedrock auto-classification (e.g. amazon.nova-micro-v1:0 or anthropic.claude-3-haiku-20240307-v1:0)

  ReservedConcurrency:
    Type: Number
    Default: 0
    MinValue: 0
    Description: >-
      Optional Lambda ReservedConcurrentExecutions (set to 1 on accounts with
      Lambda concurrency quota > 10 to enforce single-writer SQLite safety;
      leave 0 on new/sandbox accounts whose account quota is 10).

  ExistingVaultBucketName:
    Type: String
    Default: ''
    Description: >-
      Optional name of an existing S3 vault bucket to reuse (for example, a
      bucket retained from an earlier stack). When set, CloudFormation skips
      creating FolioStorageVault and connects Lambda to this bucket instead.

  EnableCognito:
    Type: String
    Default: 'true'
    AllowedValues: ['true', 'false']
    Description: >-
      Provision an invite-only AWS Cognito User Pool + TOTP MFA for authentication
      (true), or disable Cognito to use single Master Passphrase mode (false).

  SessionSecretKey:
    Type: String
    NoEcho: true
    Default: ''
    Description: >-
      HMAC signing secret for local HS256 session cookies when EnableCognito is false.

Conditions:
  HasAllowedOrigin: !Not [!Equals [!Ref AllowedOrigin, '']]
  HasReservedConcurrency: !Not [!Equals [!Ref ReservedConcurrency, 0]]
  CreateVaultBucket: !Equals [!Ref ExistingVaultBucketName, '']
  UseCognito: !Equals [!Ref EnableCognito, 'true']

Globals:
  Function:
    Timeout: 30
    MemorySize: 1024
    Architectures:
      - arm64

Resources:
  # 1. Private S3 Vault for Database Snapshots and Statement Archives
  FolioStorageVault:
    Type: AWS::S3::Bucket
    Condition: CreateVaultBucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: !Sub 'folio-vault-${EnvironmentName}-${AWS::AccountId}-${AWS::Region}'
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      VersioningConfiguration:
        Status: Enabled
      LifecycleConfiguration:
        Rules:
          - Id: ExpireOldSnapshots
            Status: Enabled
            Prefix: database/
            NoncurrentVersionExpiration:
              NoncurrentDays: 30

  # 2. AWS Cognito User Pool for Zero-Trust Identity
  FolioUserPool:
    Type: AWS::Cognito::UserPool
    Condition: UseCognito
    Properties:
      UserPoolName: !Sub 'folio-userpool-${EnvironmentName}'
      UsernameAttributes:
        - email
      UsernameConfiguration:
        CaseSensitive: false
      AdminCreateUserConfig:
        AllowAdminCreateUserOnly: true  # Prevents public sign-ups (Owner-only private vault)
        InviteMessageTemplate:
          EmailSubject: 'Your Folio Vault Invitation'
          EmailMessage: 'You have been invited to Folio. Sign in with email {username} and temporary password: {####}'
      AutoVerifiedAttributes:
        - email
      MfaConfiguration: "ON"     # Supports TOTP Authenticator apps (Google Authenticator, 1Password, Apple Keychain)
      EnabledMfas:
        - SOFTWARE_TOKEN_MFA
      Policies:
        PasswordPolicy:
          MinimumLength: 20
          RequireLowercase: true
          RequireNumbers: false
          RequireSymbols: false
          RequireUppercase: false
      AccountRecoverySetting:
        RecoveryMechanisms:
          - Name: verified_email
            Priority: 1

  # 3. Cognito User Pool App Client for SPA PWA
  FolioUserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Condition: UseCognito
    Properties:
      ClientName: !Sub 'folio-client-${EnvironmentName}'
      UserPoolId: !Ref FolioUserPool
      GenerateSecret: false
      ExplicitAuthFlows:
        - ALLOW_USER_SRP_AUTH
        - ALLOW_REFRESH_TOKEN_AUTH
        - ALLOW_USER_PASSWORD_AUTH
      PreventUserExistenceErrors: ENABLED
      TokenValidityUnits:
        AccessToken: days
        IdToken: days
        RefreshToken: days
      AccessTokenValidity: 1
      IdTokenValidity: 1
      RefreshTokenValidity: 30

  # 4. Serverless Function (FastAPI + Embedded PWA via AWS Lambda Web Adapter)
  FolioServerlessFunction:
    Type: AWS::Serverless::Function
    Properties:
      PackageType: Image
      ReservedConcurrentExecutions: !If
        - HasReservedConcurrency
        - !Ref ReservedConcurrency
        - !Ref AWS::NoValue
      Environment:
        Variables:
          AWS_LWA_PORT: "8000"
          AWS_LWA_ASYNC_INIT: "true"
          FOLIO_ENV: !Ref EnvironmentName
          SQLITE_DB_PATH: "/tmp/folio.db"
          # Lambda's filesystem is read-only outside /tmp; statement uploads must land there.
          FOLIO_UPLOAD_DIR: "/tmp/uploads"
          S3_BUCKET_NAME: !If [CreateVaultBucket, !Ref FolioStorageVault, !Ref ExistingVaultBucketName]
          FOLIO_SECRET_KEY: !Ref SessionSecretKey
          FOLIO_MASTER_PASSWORD_HASH: !Ref MasterPasswordHash
          COGNITO_USER_POOL_ID: !If [UseCognito, !Ref FolioUserPool, '']
          COGNITO_CLIENT_ID: !If [UseCognito, !Ref FolioUserPoolClient, '']
          COGNITO_REGION: !Ref AWS::Region
          FOLIO_ORIGIN_VERIFY_SECRET: !Ref OriginVerifySecret
          FOLIO_CORS_ORIGINS: !Ref AllowedOrigin
          FOLIO_BEDROCK_ENABLED: !Ref EnableBedrock
          FOLIO_BEDROCK_MODEL_ID: !Ref BedrockModelId
      FunctionUrlConfig:
        AuthType: NONE
        # The app and its API are served from the same origin, so cross-origin
        # access is not needed at all. A wildcard origin combined with
        # AllowCredentials is invalid per the CORS specification and browsers
        # reject it -- set AllowedOrigin to a real origin only if you front the
        # function with a custom domain.
        Cors: !If
          - HasAllowedOrigin
          - AllowOrigins:
              - !Ref AllowedOrigin
            AllowMethods:
              - 'GET'
              - 'POST'
              - 'PUT'
              - 'PATCH'
              - 'DELETE'
              - 'HEAD'
            AllowHeaders:
              - 'Content-Type'
              - 'Authorization'
              - 'X-Folio-Origin-Verify'
            AllowCredentials: true
          - !Ref AWS::NoValue
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - 's3:GetObject'
                - 's3:PutObject'
                - 's3:DeleteObject'
                - 's3:AbortMultipartUpload'
                - 's3:ListMultipartUploadParts'
                - 's3:ListBucket'
                - 's3:GetBucketLocation'
              Resource:
                - !If
                  - CreateVaultBucket
                  - !GetAtt FolioStorageVault.Arn
                  - !Sub 'arn:${AWS::Partition}:s3:::${ExistingVaultBucketName}'
                - !If
                  - CreateVaultBucket
                  - !Sub '${FolioStorageVault.Arn}/*'
                  - !Sub 'arn:${AWS::Partition}:s3:::${ExistingVaultBucketName}/*'
            - Effect: Allow
              Action:
                - 'bedrock:InvokeModel'
                - 'bedrock:InvokeModelWithResponseStream'
              Resource: '*'
    Metadata:
      DockerTag: latest
      DockerContext: .
      Dockerfile: Dockerfile

Outputs:
  FolioAppUrl:
    Description: Live Serverless HTTPS Endpoint for Folio App
    Value: !GetAtt FolioServerlessFunctionUrl.FunctionUrl

  CognitoUserPoolId:
    Condition: UseCognito
    Description: AWS Cognito User Pool ID
    Value: !Ref FolioUserPool

  CognitoClientId:
    Condition: UseCognito
    Description: AWS Cognito App Client ID
    Value: !Ref FolioUserPoolClient

  S3VaultBucket:
    Description: S3 Storage Vault Bucket Name
    Value: !If [CreateVaultBucket, !Ref FolioStorageVault, !Ref ExistingVaultBucketName]

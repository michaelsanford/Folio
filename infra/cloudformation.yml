AWSTemplateFormatVersion: '2010-09-09'
Description: 'Folio - Infrastructure as Code (AWS App Runner + S3 + ECR + IAM) in ca-central-1'

Parameters:
  EnvironmentName:
    Type: String
    Default: prod
    Description: Environment stage name (e.g. prod, staging, dev)

  CpuUnits:
    Type: String
    Default: '1024'
    AllowedValues: ['256', '512', '1024', '2048', '4096']
    Description: CPU units for App Runner (1024 = 1 vCPU)

  MemoryMb:
    Type: String
    Default: '2048'
    AllowedValues: ['512', '1024', '2048', '3072', '4096']
    Description: Memory in MB for App Runner (2048 = 2 GB)

Resources:
  # 1. S3 Storage Vault for Litestream Database Replication and Statement Backups
  FolioStorageBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    Properties:
      BucketName: !Sub 'folio-vault-${AWS::AccountId}-${AWS::Region}'
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      VersioningConfiguration:
        Status: Enabled
      LifecycleConfiguration:
        Rules:
          - Id: ExpireOldWalSegments
            Status: Enabled
            Prefix: db-replicas/
            NoncurrentVersionExpiration:
              NoncurrentDays: 30

  # 2. Amazon ECR Repository for Container Images
  FolioEcrRepository:
    Type: AWS::ECR::Repository
    Properties:
      RepositoryName: folio
      ImageScanningConfiguration:
        ScanOnPush: true
      LifecyclePolicy:
        LifecyclePolicyText: |
          {
            "rules": [
              {
                "rulePriority": 1,
                "description": "Keep only the 5 most recent images",
                "selection": {
                  "tagStatus": "any",
                  "countType": "imageCountMoreThan",
                  "countNumber": 5
                },
                "action": {
                  "type": "expire"
                }
              }
            ]
          }

  # 3. IAM Role for App Runner to Pull Images from ECR
  AppRunnerAccessRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub 'folio-apprunner-access-role-${AWS::Region}'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: build.apprunner.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSAppRunnerServicePolicyForECRAccess

  # 4. IAM Instance Role for App Runner to Read/Write to S3 Vault
  AppRunnerInstanceRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub 'folio-apprunner-instance-role-${AWS::Region}'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: tasks.apprunner.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: FolioS3ReplicationAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - s3:ListBucket
                  - s3:GetBucketLocation
                Resource: !GetAtt FolioStorageBucket.Arn
              - Effect: Allow
                Action:
                  - s3:PutObject
                  - s3:GetObject
                  - s3:DeleteObject
                Resource: !Sub '${FolioStorageBucket.Arn}/*'

  # 5. App Runner Auto-Scaling Configuration (Fixed to 1 instance for SQLite WAL locking)
  AppRunnerAutoScalingConfig:
    Type: AWS::AppRunner::AutoScalingConfigurationAssociation
    Properties:
      AutoScalingConfigurationArn: !GetAtt SingleInstanceAutoScalingConfig.AutoScalingConfigurationArn
      ServiceArn: !GetAtt FolioAppRunnerService.ServiceArn

  SingleInstanceAutoScalingConfig:
    Type: AWS::AppRunner::AutoScalingConfiguration
    Properties:
      AutoScalingConfigurationName: folio-single-instance-scaler
      MinSize: 1
      MaxSize: 1
      MaxConcurrency: 100

  # 6. AWS App Runner Unified Service (FastAPI + Embedded React PWA)
  FolioAppRunnerService:
    Type: AWS::AppRunner::Service
    Properties:
      ServiceName: !Sub 'folio-${EnvironmentName}'
      SourceConfiguration:
        AuthenticationConfiguration:
          AccessRoleArn: !GetAtt AppRunnerAccessRole.Arn
        AutoDeploymentsEnabled: true
        ImageRepository:
          ImageIdentifier: !Sub '${AWS::AccountId}.dkr.ecr.${AWS::Region}.amazonaws.com/folio:latest'
          ImageRepositoryType: ECR
          ImageConfiguration:
            Port: '8000'
            RuntimeEnvironmentVariables:
              - Name: SQLITE_DB_PATH
                Value: /app/data/folio.db
              - Name: S3_BUCKET_NAME
                Value: !Ref FolioStorageBucket
              - Name: AWS_DEFAULT_REGION
                Value: !Ref AWS::Region
      InstanceConfiguration:
        Cpu: !Ref CpuUnits
        Memory: !Ref MemoryMb
        InstanceRoleArn: !GetAtt AppRunnerInstanceRole.Arn
      HealthCheckConfiguration:
        Protocol: HTTP
        Path: /api/health
        Interval: 10
        Timeout: 5
        HealthyThreshold: 1
        UnhealthyThreshold: 3

Outputs:
  ServiceUrl:
    Description: Live Public HTTPS URL for Folio App
    Value: !Sub 'https://${FolioAppRunnerService.ServiceUrl}'
    Export:
      Name: !Sub '${AWS::StackName}-ServiceUrl'

  S3VaultBucket:
    Description: S3 Storage Vault Bucket Name for Litestream Replicas
    Value: !Ref FolioStorageBucket

  EcrRepositoryUri:
    Description: Amazon ECR Repository URI
    Value: !GetAtt FolioEcrRepository.RepositoryUri

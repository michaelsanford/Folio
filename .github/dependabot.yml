version: 2
updates:
  # Python Backend Dependencies
  - package-ecosystem: "uv"
    directory: "/backend"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    ignore:
      # botocore requires python-dateutil < 3; a major bump makes the grouped
      # update unresolvable and fails the whole group.
      - dependency-name: "python-dateutil"
        update-types: ["version-update:semver-major"]
    groups:
      python-dependencies:
        patterns:
          - "*"

  # Node.js Frontend Dependencies
  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    groups:
      npm-dependencies:
        patterns:
          - "*"

  # GitHub Actions Workflows
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 3

  # Dockerfile base images (node, python, uv, Lambda Web Adapter)
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 3
    ignore:
      # Python minor upgrades need requires-python in backend/pyproject.toml
      # raised first; take them deliberately rather than via Dependabot.
      - dependency-name: "python"
        update-types: ["version-update:semver-minor"]

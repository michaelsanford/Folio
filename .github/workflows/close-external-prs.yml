name: Disallow External Pull Requests

on:
  pull_request_target:
    types: [opened, reopened]

jobs:
  close-pr:
    name: Close External PR
    runs-on: ubuntu-latest
    if: github.actor != 'michaelsanford' && github.actor != 'dependabot[bot]'
    permissions:
      pull-requests: write
      issues: write
    steps:
      - name: Close and comment on external PR
        uses: actions/github-script@v8
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: "Thank you for your interest in Folio. This repository is a personal private project maintained exclusively by the author and does not accept external pull requests or contributions."
            });
            await github.rest.pulls.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number,
              state: "closed"
            });
            await github.rest.issues.lock({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              lock_reason: "resolved"
            });

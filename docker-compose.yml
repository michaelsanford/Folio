name: folio

services:
  folio:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: folio-app
    ports:
      # Loopback only by default; change to "8000:8000" to expose on the LAN.
      - "127.0.0.1:8000:8000"
    volumes:
      - ./backend/data:/app/data
    environment:
      - SQLITE_DB_PATH=/app/data/folio.db
      - FOLIO_UPLOAD_DIR=/app/data/uploads
      - FOLIO_ENV=${FOLIO_ENV:-development}
      # Authentication is fail-closed: without one of these the app starts but
      # every API call is rejected and the UI stays locked. Generate a hash with:
      #   uv run --directory backend python scripts/hash_password.py   (reads the passphrase on stdin)
      - FOLIO_MASTER_PASSWORD_HASH=${FOLIO_MASTER_PASSWORD_HASH:-}
      # Signs session tokens. When unset, a random key is generated on first run
      # and kept in ./backend/data/.folio_secret_key. Required when FOLIO_ENV is
      # production/prod, where startup refuses to use a generated key.
      - FOLIO_SECRET_KEY=${FOLIO_SECRET_KEY:-}
      # Optional: when set, every request must carry this value in the
      # X-Folio-Origin-Verify header (use it behind a reverse proxy that adds it).
      - FOLIO_ORIGIN_VERIFY_SECRET=${FOLIO_ORIGIN_VERIFY_SECRET:-}
      # Optional S3 vault. On start the app restores database/folio.db from S3
      # only when the local database file is missing, so ./backend/data stays the
      # working copy across restarts. Changes are uploaded with S3 conditional
      # writes: if another instance (for example the Lambda deployment) changed
      # the vault first, the upload is rejected instead of overwriting it.
      - S3_BUCKET_NAME=${S3_BUCKET_NAME:-}
      - AWS_DEFAULT_REGION=${AWS_DEFAULT_REGION:-ca-central-1}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID:-}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY:-}
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/api/health"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3
    restart: unless-stopped
